<!DOCTYPE html>
<html>
  <head>
    <title>  </title>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
       body{background-color: #FFF8DC;}
      header{width: 100%; height: 100px; text-align: center;}
      footer{width: 100%; height: 70px; text-align: center; font-size: 20px; padding: 6px;}
      nav ul li{list-style-type: none; display: inline-block; font-size: 25px; font-weight: bold;}
      nav ul li a{text-decoration: none; color: #556B2F; font-size: 25px; margin: 10px;}
    </style>
    <script>
      function validate(){
var name1=document.getElementById("name").value;
var phone1=document.getElementById("phone").value;
var email1=document.getElementById("email").value;
var message1=document.getElementById("message").value;

        if(name1.length<5){
          text="Please enter your full name";
          error.innerHTML=text;
          return false;
      }

        if(isNaN(phone1) || phone1.length!=10){
          text="Please enter a vaild phone number";
          error.innerHTML=text;
          return false;
        }

        if(email1.indexOf("@")==-1 || email1.length<6){
            text="Please enter a vaild email";
          error.innerHTML=text;
          return false;
        }

        if(message1.length<=10){
            text="Please enter more than 10 characters";
          error.innerHTML=text;
          return false;
        }

        alert("Form submitted successfully")
        return true;
      }
    </script>
  </head>
  <body>
<header>
   <h1>Madagascar</h1> 
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li> |
      <li><a href="hotels.html">Hotels</a></li> |
      <li><a href="food.html">Food</a></li> |
      <li><a href="contact.html">Contact Us</a></li> 
    </ul>
  </nav>
</header>
    <main>
     <div class="wrapper">
       <h2>Contact Us</h2>
       <form class="form2" onsubmit="return validate();">
         <div class="inputfield">
           <input type="text" placeholder="Name" id="name">
         </div>

          <div class="inputfield">
           <input type="text" placeholder="Phone" id="phone">
         </div>

          <div class="inputfield">
           <input type="text" placeholder="Email" id="email">
         </div>

          <div class="inputfield">
           <textarea placeholder="Message" id="message"></textarea>
         </div>

         <div class="btn">
           <input type="submit">
         </div>

         <div id="error"></div>
       </form>
     </div>
    </main>
    <footer>
      To know more about Madagascar <a href="https://en.wikipedia.org/wiki/Madagascar">Click here</a>
    </footer>
  </body>
</html>
